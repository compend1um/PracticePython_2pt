<!doctype html>
<html lang="RU">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Главная</title>
</head>
<body>
    <h2>Список видеокарт</h2>
    <a href="create/">Добавление видеокарты</a>
    <table>
        <thead><th>Название</th><th>Цена</th><th>Бренд</th><th></th></thead>
        {% for model in models %}
        <tr>
            <td>{{ model.name }}</td>
            <td>{{ model.price }}</td>
            <td>{{ model.brand.name }}</td>
            <td>
                <a href="edit/{{model.id}}">Изменить</a> | <a href="delete/{{model.id}}">Удалить</a>
            </td>
        </tr>
        {% endfor %}
    </table>

</body>
</html>
